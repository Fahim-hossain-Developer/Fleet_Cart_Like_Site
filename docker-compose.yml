services:
  php:
    image: commerce-php83
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      secrets: [proxy_ca]
    working_dir: /app
    volumes: [".:/app"]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: commerce
      DB_USERNAME: commerce
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env for Docker MySQL}"
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    image: nginx:stable-alpine
    ports: ["8000:80"]
    volumes: [".:/app:ro", "./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [php]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: commerce
      MYSQL_USER: commerce
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
volumes:
  mysql-data:
secrets:
  proxy_ca:
    file: "${DEV_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
